[tool.poetry]
name = "expense-tracker"
version = "0.1.0"
description = "Local Python package entrypoint to help create e2e tests for the Expense Tracker app"
authors = ["Alexus Wong <alexus888@gmail.com>"]
packages = [
    { include = "utilities", from = "lib" },
]


[tool.poetry.dependencies]
python = "^3.12"
click = "^8.1.3"
pytest-playwright = "^0.6.2"
pytest = "^8.3.4"
pytest-testdox = "^3.1.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
utilities = 'utilities.cli:main'

[tool.pytest.ini_options]
addopts = '--testdox --headed -vs'
testpaths = [
    "src",
]
python_files = [
    "*_tests.py"
]


